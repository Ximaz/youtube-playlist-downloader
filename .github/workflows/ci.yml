name: CI

on:
  push:
    branches: [main]
  pull_request:

# Root-level token scopes. `packages: write` is required for the build-images
# job to push to GHCR; every other job only needs `contents: read`.
permissions:
  contents: read
  packages: write

jobs:
  ts-lint-tsc-fmt:
    name: TS — lint + typecheck + format:check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ypd/shared build
      - run: pnpm --filter @ypd/backend-core build
      - run: pnpm -r format:check
      - run: pnpm -r typecheck
      - run: pnpm -r --if-present lint

  python-ruff-mypy:
    name: Python — ruff + mypy (provider-ytdl)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/providers/ytdl
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app

  build-images:
    name: Docker — build images
    runs-on: ubuntu-24.04
    needs: [ts-lint-tsc-fmt, python-ruff-mypy]
    strategy:
      matrix:
        image:
          - { name: backend, context: ., dockerfile: apps/backend/Dockerfile }
          - { name: worker, context: ., dockerfile: apps/worker/Dockerfile }
          - { name: frontend, context: ., dockerfile: apps/frontend/Dockerfile }
          - { name: provider-ytdl, context: apps/providers/ytdl, dockerfile: Dockerfile }
          - { name: provider-youtubejs, context: apps/providers/youtubejs, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Authenticate to GHCR only when we will actually push (push to main).
      # PR builds skip this step — GITHUB_TOKEN on a fork PR lacks packages:write.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` is only generated on the default branch; `sha-<short>` is always
      # generated so PR builds still have a valid tag for the local build artifact.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ypd-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ypd/shared build
      - run: pnpm --filter @ypd/backend-core build
      - run: pnpm -r --if-present test
