[project]
name = "provider-ytdl"
version = "0.1.0"
description = "YPD provider: yt-dlp HTTP server (YouTube metadata + media streaming)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "yt-dlp==2026.7.4",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    # yt-dlp plugin: fetches PO tokens from the shared bgutil POT provider sidecar when a
    # client/format requires one (per-video, automatic). Dormant until YouTube demands a token.
    "bgutil-ytdlp-pot-provider==1.3.1",
]

[dependency-groups]
dev = ["ruff==0.16.3", "mypy==2.3.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
