# Cilium for Talos: CNI + kube-proxy replacement + L2 LoadBalancer. See infra/docs/architecture.md.

ipam:
  mode: kubernetes

kubeProxyReplacement: true
# Control-plane VIP; keep in sync with terraform `cluster_vip`.
k8sServiceHost: "192.168.0.201"
k8sServicePort: 6443

# Talos-specific: cgroupv2 pre-mounted; explicit capabilities under Talos's locked-down runtime.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent:
      [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

# Bare-metal LoadBalancer: announce Service IPs over L2 (ARP). Requires kubeProxyReplacement.
l2announcements:
  enabled: true
externalIPs:
  enabled: true
loadBalancer:
  algorithm: maglev
# L2 announcements are API-chatty; raise the client rate limit (Cilium docs).
k8sClientRateLimit:
  qps: 20
  burst: 40

operator:
  replicas: 1 # single control-plane; raise alongside control_plane_count

# Hubble — handy for debugging the data path; drop if you want it leaner.
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
