# YPD secrets TEMPLATE (committed). Copy to secrets.yaml, fill CHANGE_ME, `sops -e` to secrets.sops.yaml.
# CROSS-EQUALITY (unenforced; wrong = /ready fails silently):
#   CACHE_URL host/creds       MUST match ypd-valkey VALKEY_USERNAME/PASSWORD
#   DATABASE_URL host/creds    MUST match ypd-postgres POSTGRES_USER/PASSWORD/DB
#   S3_ACCESS_KEY/S3_SECRET_KEY MUST EQUAL ypd-seaweedfs AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: ypd-backend-secrets
type: Opaque
stringData:
  CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  QUEUE_CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  EPHEMERAL_CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  DATABASE_URL: "postgresql://ypd:CHANGE_ME_PG_PASS@ypd-postgres:5432/ypd?schema=public"
  S3_ACCESS_KEY: "CHANGE_ME_S3_ACCESS"
  S3_SECRET_KEY: "CHANGE_ME_S3_SECRET"
  # OAuth (only when google.enabled=true) — otherwise omit:
  # GOOGLE_CLIENT_ID: "CHANGE_ME"
  # GOOGLE_CLIENT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: ypd-worker-secrets
type: Opaque
stringData:
  # Worker subset — NO DATABASE_URL, NO GOOGLE_* (blast-radius split).
  CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  QUEUE_CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  EPHEMERAL_CACHE_URL: "redis://ypd:CHANGE_ME_VALKEY_PASS@ypd-valkey:6379"
  S3_ACCESS_KEY: "CHANGE_ME_S3_ACCESS"
  S3_SECRET_KEY: "CHANGE_ME_S3_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: ypd-valkey
type: Opaque
stringData:
  VALKEY_USERNAME: "ypd"
  VALKEY_PASSWORD: "CHANGE_ME_VALKEY_PASS"
---
apiVersion: v1
kind: Secret
metadata:
  name: ypd-postgres
type: Opaque
stringData:
  POSTGRES_USER: "ypd"
  POSTGRES_PASSWORD: "CHANGE_ME_PG_PASS"
  POSTGRES_DB: "ypd"
---
apiVersion: v1
kind: Secret
metadata:
  name: ypd-seaweedfs
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME_S3_ACCESS"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_S3_SECRET"
