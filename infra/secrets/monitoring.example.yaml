# Grafana admin login (committed TEMPLATE). Copy to monitoring.yaml, set a strong password, then
#   sops -e monitoring.yaml > monitoring.sops.yaml
# `task cluster:addons` applies it to the monitoring namespace BEFORE the kube-prometheus-stack sync,
# so Grafana can read it via grafana.admin.existingSecret. Real values stay out of git (gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME_STRONG_PASSWORD
