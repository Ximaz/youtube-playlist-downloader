# SOPS creation rules. Only the secret VALUES (stringData) are encrypted — the manifest structure
# (kind/metadata/keys) stays readable, so `sops -d secrets.sops.yaml | kubectl apply -f -` works and
# git diffs show shape, not secrets. Decryption needs the age PRIVATE key (operator-held at
# ~/.config/sops/age/keys.txt, gitignored). The encrypted secrets.sops.yaml is safe to commit.
creation_rules:
  - path_regex: (^|/)secrets\.(sops\.)?yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age127j52e0nqt3np884pzjmc5ghqak2cnygshq9utdwd30zm3j6dc2s3e7fez
