{{- $component := "backend-worker" }}
{{/* KEDA worker autoscaler — see infra/docs/architecture.md. KEDA owns the worker's HPA — do NOT template a HorizontalPodAutoscaler for it. */}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ypd.componentName" (list . $component) }}
  labels:
    {{- include "ypd.labels" (list . $component) | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "ypd.componentName" (list . $component) }}
  minReplicaCount: {{ .Values.worker.scaledObject.minReplicas }}
  maxReplicaCount: {{ .Values.worker.scaledObject.maxReplicas }}
  cooldownPeriod: {{ .Values.worker.scaledObject.cooldownPeriod }}
  pollingInterval: {{ .Values.worker.scaledObject.pollingInterval }}
  triggers:
    - type: metrics-api
      metadata:
        # FQDN: KEDA is cross-namespace.
        url: "http://{{ include "ypd.componentName" (list . "backend-api") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backendApi.port }}/scaling/backlog"
        valueLocation: "total"
        targetValue: {{ .Values.config.worker.downloadConcurrency | quote }}
