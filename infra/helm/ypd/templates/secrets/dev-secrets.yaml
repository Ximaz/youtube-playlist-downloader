{{/* DEV-ONLY Secret rendering. In prod, secrets.existingSecret is set and this renders NOTHING — the
     real per-image Secrets are created out-of-band from infra/secrets/secrets.sops.yaml (age-encrypted)
     so credentials never pass through Helm's release. This path exists only for kind/local smoke tests
     with throwaway values; NEVER commit real creds under secrets.values. See NOTES.txt for the loud
     warning. */}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ypd.backendSecretName" . }}
  labels:
    {{- include "ypd.labels" (list . "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ypd.workerSecretName" . }}
  labels:
    {{- include "ypd.labels" (list . "worker") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.workerValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
