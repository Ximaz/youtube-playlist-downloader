{{/* DEV-ONLY Secret rendering. NEVER commit real creds under secrets.values; prod uses secrets.existingSecret. */}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ypd.backendSecretName" . }}
  labels:
    {{- include "ypd.labels" (list . "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ypd.workerSecretName" . }}
  labels:
    {{- include "ypd.labels" (list . "worker") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.workerValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
