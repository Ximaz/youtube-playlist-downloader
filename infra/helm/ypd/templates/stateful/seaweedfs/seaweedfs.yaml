{{- if .Values.seaweedfs.inCluster }}
{{- $component := "seaweedfs" }}
# In-cluster SeaweedFS S3 gateway (all-in-one `weed server -s3`).
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY must EQUAL the backend's S3_ACCESS_KEY / S3_SECRET_KEY.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ypd.seaweedfsName" . }}
  labels:
    {{- include "ypd.labels" (list . $component) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ypd.selectorLabels" (list . $component) | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ypd.seaweedfsName" . }}
  labels:
    {{- include "ypd.labels" (list . $component) | nindent 4 }}
spec:
  serviceName: {{ include "ypd.seaweedfsName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ypd.selectorLabels" (list . $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ypd.labels" (list . $component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.persistence.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - weed
            - server
            - -dir=/data
            - -volume.max=100
            - -ip=$(POD_IP)
            - -ip.bind=0.0.0.0
            - -s3
            - -s3.port=8333
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: {{ .Values.seaweedfs.existingSecret }}
          ports:
            - name: s3
              containerPort: 8333
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          securityContext:
            {{- include "ypd.containerSecurityContext" (list . false) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage }}
{{- end }}
