{{/* One ServiceAccount per workload class; automountServiceAccountToken: false (see infra/docs/architecture.md). */}}
{{- range $i, $class := list "backend" "worker" "frontend" "provider" }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ypd.serviceAccountName" (list $ $class) }}
  labels:
    {{- include "ypd.labels" (list $ (printf "%s-sa" $class)) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
