{{/* One ServiceAccount per workload class, all with automountServiceAccountToken: false — no YPD
     pod talks to the Kubernetes API, so the token is pure attack surface (ADR / Design ref §1). No
     Role grants Secret get/list/watch to any of these: pods receive secrets via envFrom at admission
     (kubelet reads them with the node identity), so a compromised pod cannot enumerate Secrets. */}}
{{- range $i, $class := list "backend" "worker" "frontend" "provider" }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ypd.serviceAccountName" (list $ $class) }}
  labels:
    {{- include "ypd.labels" (list $ (printf "%s-sa" $class)) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
