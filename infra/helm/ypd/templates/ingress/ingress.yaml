{{- if .Values.ingress.enabled }}
{{/* The browser reaches ONLY the frontend BFF; /api + /socket.io are proxied internally by Nitro, so
     the ingress fronts the frontend Service alone. ingress-nginx handles the WS upgrade; the long
     read/send timeouts are set globally on the controller (bootstrap/ingress-nginx/values.yaml). */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ypd.componentName" (list . "frontend") }}
  labels:
    {{- include "ypd.labels" (list . "frontend") | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      secretName: {{ include "ypd.componentName" (list . "tls") }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ypd.componentName" (list . "frontend") }}
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
